[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "summarization-claim-audit"
version = "0.1.0"
description = "Offline audit of documentation claims against Python source"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "summarization-claim-audit contributors"}]
dependencies = []

[project.scripts]
summarization-claim-audit = "summarization_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["summarization_claim_audit*"]
